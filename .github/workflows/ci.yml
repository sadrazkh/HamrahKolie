name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Restore .NET
        run: dotnet restore HamrahKolie.slnx

      - name: Build
        run: dotnet build HamrahKolie.slnx -c Release --no-restore

      - name: Test
        run: dotnet test tests/HamrahKolie.Tests/HamrahKolie.Tests.csproj -c Release --no-build

      - name: Build frontend
        working-directory: src/HamrahKolie.Web/ClientApp
        run: |
          npm ci
          npm run build
